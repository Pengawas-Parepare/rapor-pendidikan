<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendampingan Sekolah Binaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182b22;
    --ink-soft:#3f5347;
    --paper:#f3f0e6;
    --paper-2:#fbfaf5;
    --line:#d8d2c0;
    --line-strong:#b9b19a;
    --pine:#1f4034;
    --pine-2:#2c5a49;
    --gold:#b9862f;
    --gold-soft:#f1e3c4;
    --berdaya:#2c5a49;
    --berdaya-bg:#e2ede7;
    --berkembang:#8a5a1e;
    --berkembang-bg:#f4e6cd;
    --utama:#7a2620;
    --utama-bg:#f3e0dd;
    --menengah:#8a5a1e;
    --menengah-bg:#f4e6cd;
    --akhir:#2c5a49;
    --akhir-bg:#e2ede7;
    --danger:#912e28;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', -apple-system, sans-serif;
    font-size:15px;
    line-height:1.55;
  }
  h1,h2,h3,.serif{ font-family:'Source Serif 4', Georgia, serif; }
  .app{ max-width:1180px; margin:0 auto; padding:0 24px 80px; }

  /* top identity bar */
  .masthead{
    border-bottom:2px solid var(--pine);
    padding:22px 0 16px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap;
  }
  .masthead .mark{ display:flex; align-items:center; gap:14px; }
  .mark .seal{
    width:42px; height:42px; border-radius:50%; border:2px solid var(--pine);
    display:flex; align-items:center; justify-content:center;
    font-family:'Source Serif 4',serif; font-weight:600; color:var(--pine); font-size:15px;
    flex:none;
  }
  .masthead h1{ font-size:22px; font-weight:600; margin:0; color:var(--pine); letter-spacing:.2px; }
  .masthead .tagline{ margin:2px 0 0; font-size:13px; color:var(--ink-soft); }
  .profil-btn{
    background:none; border:1px solid var(--line-strong); color:var(--ink-soft);
    font-family:'Public Sans',sans-serif; font-size:13px; padding:7px 14px; border-radius:3px; cursor:pointer;
  }
  .profil-btn:hover{ border-color:var(--pine); color:var(--pine); }

  /* stepper nav */
  .stepper{ display:flex; gap:2px; margin:22px 0 30px; border:1px solid var(--line); background:var(--paper-2); border-radius:4px; overflow:hidden; flex-wrap:wrap;}
  .step-btn{
    flex:1; min-width:150px; text-align:left; background:none; border:none; cursor:pointer;
    padding:13px 16px; border-right:1px solid var(--line); font-family:'Public Sans',sans-serif;
    color:var(--ink-soft);
  }
  .step-btn:last-child{ border-right:none; }
  .step-btn .num{ font-size:11px; letter-spacing:.4px; display:block; margin-bottom:3px; color:var(--line-strong); }
  .step-btn .lbl{ font-size:14px; font-weight:500; display:block; }
  .step-btn.active{ background:var(--pine); color:#fff; }
  .step-btn.active .num{ color:var(--gold-soft); }
  .step-btn.active .lbl{ color:#fff; }
  .step-btn:not(.active):hover{ background:var(--paper); }

  /* panel */
  .panel{ background:var(--paper-2); border:1px solid var(--line); border-radius:4px; padding:26px 30px; margin-bottom:22px; }
  .panel h2{ font-size:19px; margin:0 0 4px; color:var(--pine); font-weight:600; }
  .panel .sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 20px; max-width:640px; }
  .section-divider{ border:none; border-top:1px solid var(--line); margin:26px 0; }

  /* dashboard */
  .metrics{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:26px; }
  .metric{ background:var(--paper-2); border:1px solid var(--line); border-radius:4px; padding:16px 18px; }
  .metric .n{ font-family:'Source Serif 4',serif; font-size:30px; color:var(--pine); font-weight:600; line-height:1; }
  .metric .l{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }

  table.roster{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.roster th{ text-align:left; font-size:11.5px; letter-spacing:.3px; color:var(--ink-soft); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--line-strong); }
  table.roster td{ padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.roster tr:hover td{ background:var(--paper); cursor:pointer; }
  .badge{ display:inline-block; padding:3px 10px; border-radius:3px; font-size:12px; font-weight:500; }
  .badge.berdaya{ background:var(--berdaya-bg); color:var(--berdaya); }
  .badge.berkembang{ background:var(--berkembang-bg); color:var(--berkembang); }
  .badge.rendah{ background:var(--utama-bg); color:var(--utama); }
  .badge.sedang{ background:var(--menengah-bg); color:var(--menengah); }
  .badge.tinggi{ background:var(--akhir-bg); color:var(--akhir); }
  .badge.prioritas-utama{ background:var(--utama-bg); color:var(--utama); }
  .badge.prioritas-menengah{ background:var(--menengah-bg); color:var(--menengah); }
  .badge.prioritas-akhir{ background:var(--akhir-bg); color:var(--akhir); }
  .badge.muted{ background:#eae6d8; color:var(--ink-soft); }
  .badge.baik{ background:var(--berdaya-bg); color:var(--berdaya); }
  .badge.cukup{ background:var(--menengah-bg); color:var(--menengah); }
  .badge.sedang.cap{ background:var(--menengah-bg); color:var(--menengah); }
  .badge.kurang{ background:var(--utama-bg); color:var(--utama); }

  .upload-box{ border:1.5px dashed var(--line-strong); border-radius:5px; padding:26px; text-align:center; background:var(--paper); }
  .upload-box input[type=file]{ display:block; margin:12px auto 0; max-width:320px; }
  .upload-box .fname{ margin-top:10px; font-size:12.5px; color:var(--ink-soft); }
  .upload-msg{ font-size:13px; margin-top:10px; }
  .upload-msg.ok{ color:var(--berdaya); }
  .upload-msg.err{ color:var(--danger); }

  table.indikator{ width:100%; border-collapse:collapse; font-size:13px; margin-bottom:18px; }
  table.indikator th{ text-align:left; font-size:11px; color:var(--ink-soft); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line-strong); }
  table.indikator td{ padding:8px 8px; border-bottom:1px solid var(--line); }
  .dim-block-title{ font-size:12px; text-transform:uppercase; letter-spacing:.3px; color:var(--pine); font-weight:600; margin:18px 0 6px; }

  .rekom-item{ border:1px solid var(--line-strong); border-radius:4px; padding:14px 16px; margin-bottom:10px; background:#fff; }
  .rekom-item .rekom-head{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .rekom-item .rekom-title{ font-size:13.5px; font-weight:500; }
  .rekom-item .rekom-akar{ font-size:12px; color:var(--gold); margin-top:2px; }
  .rekom-item .rekom-link{ font-size:12px; margin-top:8px; }
  .rekom-item .rekom-link a{ color:var(--pine-2); }

  .visit-item{ border:1px solid var(--line-strong); border-radius:4px; padding:14px 16px; margin-bottom:10px; background:#fff; }
  .visit-item .visit-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .visit-item .visit-date{ font-family:'Source Serif 4',serif; font-size:15px; color:var(--pine); font-weight:600; }
  .visit-item .visit-jenis{ font-size:11.5px; color:var(--gold); text-transform:uppercase; letter-spacing:.3px; margin-top:2px; }
  .visit-item .visit-body{ font-size:13.5px; color:var(--ink-soft); margin-top:8px; white-space:pre-wrap; }
  .visit-item .visit-tl{ font-size:13px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); white-space:pre-wrap; }
  .visit-item .visit-tl .lbl{ font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px; }

  table.rkas{ width:100%; border-collapse:collapse; font-size:13px; }
  table.rkas th{ text-align:left; font-size:11px; letter-spacing:.2px; color:var(--ink-soft); font-weight:500; padding:7px 8px; border-bottom:1px solid var(--line-strong); background:var(--paper); }
  table.rkas td{ padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.rkas td.num{ text-align:right; }
  table.rkas tfoot td{ font-weight:600; border-top:2px solid var(--line-strong); border-bottom:none; padding-top:8px; }
  .rkas-cell-input{ width:100%; border:1px solid transparent; background:transparent; padding:5px 6px; font-family:'Public Sans',sans-serif; font-size:13px; border-radius:3px; }
  .rkas-cell-input:hover{ border-color:var(--line); }
  .rkas-cell-input:focus{ border-color:var(--pine-2); background:#fff; outline:none; }
  select.rkas-cell-input{ padding:5px 4px; }
  .rkas-source-tag{ font-size:10.5px; color:var(--gold); text-transform:uppercase; letter-spacing:.2px; display:block; margin-top:2px; }
  .sumber-summary{ display:flex; gap:16px; flex-wrap:wrap; margin-top:16px; }
  .sumber-summary .box{ background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:10px 16px; min-width:140px; }
  .sumber-summary .box .l{ font-size:11.5px; color:var(--ink-soft); }
  .sumber-summary .box .v{ font-family:'Source Serif 4',serif; font-size:16px; color:var(--pine); font-weight:600; margin-top:2px; }

  .year-select{ padding:6px 8px; font-size:12.5px; border:1px solid var(--line-strong); border-radius:3px; background:#fff; }
  .rkjm-year-group{ margin-bottom:20px; }
  .rkjm-year-title{ font-family:'Source Serif 4',serif; font-size:16px; color:var(--pine); border-bottom:2px solid var(--pine); padding-bottom:6px; margin-bottom:10px; }

  /* buttons/forms */
  .btn{ font-family:'Public Sans',sans-serif; font-size:13.5px; font-weight:500; padding:9px 18px; border-radius:3px; cursor:pointer; border:1px solid var(--pine); background:var(--pine); color:#fff; }
  .btn:hover{ background:var(--pine-2); }
  .btn.secondary{ background:none; color:var(--pine); }
  .btn.secondary:hover{ background:var(--paper); }
  .btn.ghost{ background:none; border-color:var(--line-strong); color:var(--ink-soft); }
  .btn.ghost:hover{ border-color:var(--pine); color:var(--pine); }
  .btn.danger{ background:none; border-color:var(--danger); color:var(--danger); }
  .btn.danger:hover{ background:#fbecea; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }

  label.field{ display:block; margin-bottom:14px; }
  label.field span{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; }
  input[type=text], input[type=number], select, textarea{
    width:100%; font-family:'Public Sans',sans-serif; font-size:14px; padding:9px 11px;
    border:1px solid var(--line-strong); border-radius:3px; background:#fff; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:64px; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--pine-2); outline-offset:1px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 20px; }
  .error-text{ color:var(--danger); font-size:12.5px; margin:-8px 0 12px; }
  .empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty .big{ font-family:'Source Serif 4',serif; font-size:19px; color:var(--pine); margin-bottom:6px; }

  select.school-picker{ max-width:340px; }

  /* reflection question card */
  .question{ border-top:1px solid var(--line); padding:20px 0; }
  .question:first-of-type{ border-top:none; }
  .question .qnum{ font-size:11.5px; color:var(--gold); font-weight:600; letter-spacing:.3px; }
  .question .qtext{ font-family:'Source Serif 4',serif; font-size:16.5px; margin:6px 0 14px; color:var(--ink); }
  .opt{
    display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line);
    border-radius:4px; margin-bottom:8px; cursor:pointer; background:#fff;
  }
  .opt:hover{ border-color:var(--pine-2); }
  .opt.selected{ border-color:var(--pine); background:var(--paper); }
  .opt input{ margin-top:3px; flex:none; }
  .opt .opt-lvl{ font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; display:block; margin-bottom:3px; }
  .opt.selected .opt-lvl{ color:var(--pine); }
  .opt .opt-text{ font-size:13.5px; color:var(--ink-soft); }

  .result-strip{ display:flex; gap:24px; flex-wrap:wrap; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:16px 20px; margin-top:6px; }
  .result-strip .item .l{ font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; }

  /* strategi */
  .strategi-card{ border:1px solid var(--line-strong); border-radius:4px; overflow:hidden; }
  .strategi-head{ background:var(--pine); color:#fff; padding:16px 22px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .strategi-head h3{ margin:0; font-size:17px; font-weight:600; }
  .strategi-body{ padding:18px 22px; background:#fff; }
  .strategi-body p{ margin:0 0 12px; font-size:13.5px; color:var(--ink-soft); }
  .kv-row{ display:flex; gap:30px; margin-bottom:14px; flex-wrap:wrap; }
  .kv-row .kv .l{ font-size:11.5px; color:var(--ink-soft); }
  .kv-row .kv .v{ font-family:'Source Serif 4',serif; font-size:15px; color:var(--pine); }

  /* rkt library */
  .dim-group{ margin-bottom:22px; }
  .dim-title{ font-size:12px; letter-spacing:.3px; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:10px; }
  .prog-item{ border:1px solid var(--line); border-radius:4px; padding:13px 16px; margin-bottom:8px; background:#fff; }
  .prog-item .prog-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; cursor:pointer; }
  .prog-item .prog-title{ font-size:14px; font-weight:500; color:var(--ink); }
  .prog-item .steps{ margin:10px 0 0; padding-left:18px; font-size:13px; color:var(--ink-soft); }
  .prog-item .steps li{ margin-bottom:4px; }
  .chk{ flex:none; width:19px; height:19px; margin-top:2px; }

  .selected-list .row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }
  .selected-list .row .t{ font-size:13.5px; }
  .remove-x{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; line-height:1; padding:4px; }
  .remove-x:hover{ color:var(--danger); }

  .report{ background:#fff; border:1px solid var(--line-strong); border-radius:4px; padding:30px 34px; font-family:'Source Serif 4',serif; font-size:14.5px; line-height:1.75; color:var(--ink); }
  .report h3{ font-size:12.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--gold); font-family:'Public Sans',sans-serif; font-weight:600; margin:22px 0 8px; }
  .report h3:first-child{ margin-top:0; }
  .report p{ margin:0 0 10px; }
  .report ol{ margin:0 0 10px; padding-left:20px; }
  .report .rpt-title{ font-size:19px; font-weight:600; margin-bottom:2px; }
  .report .rpt-sub{ font-family:'Public Sans',sans-serif; font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; }

  .modal-overlay{ position:absolute; inset:0; background:rgba(24,43,34,.45); display:flex; align-items:flex-start; justify-content:center; padding:60px 20px; z-index:50; }
  .modal{ background:#fff; border-radius:5px; padding:26px 28px; max-width:460px; width:100%; box-shadow:0 12px 30px rgba(0,0,0,.2); }
  .modal h3{ margin:0 0 16px; font-size:17px; color:var(--pine); }
  .rel-wrap{ position:relative; }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; }
    .panel{ border:none; padding:0; }
    .tw-section{ page-break-before:always; }
    .tw-section:first-of-type{ page-break-before:auto; }
  }
  @media (max-width:720px){
    .grid2{ grid-template-columns:1fr; }
    .kv-row{ gap:16px; }
  }
</style>
</head>

<div class="app" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

};

var PRIORITAS_ORDER = { 'Prioritas Utama':0, 'Prioritas Menengah':1, 'Prioritas Akhir':2 };

var RKT_LIBRARY = [
  { dimensi:'Literasi', judul:'Peningkatan kompetensi guru dan kebijakan yang menunjang kompetensi membaca teks sastra', langkah:[

};

function fixSheetRange(sheet){
  if(!sheet) return sheet;
  var maxR = 0, maxC = 0;
  Object.keys(sheet).forEach(function(key){
    if(key.charAt(0) === '!') return;
    var m = key.match(/^([A-Z]+)(\d+)$/);
    if(!m) return;
    var col = 0;
    for(var i=0;i<m[1].length;i++){ col = col*26 + (m[1].charCodeAt(i)-64); }
    col -= 1;
    var row = parseInt(m[2],10) - 1;
    if(row > maxR) maxR = row;
    if(col > maxC) maxC = col;
  });
  sheet['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:maxR,c:maxC} });
  return sheet;
}

function findSheet(workbook, needle){
  var names = workbook.SheetNames;
  for(var i=0;i<names.length;i++){
    if(names[i].toUpperCase().indexOf(needle) > -1) return fixSheetRange(workbook.Sheets[names[i]]);
  }
  return null;
}

function cellText(v){
  if(v === undefined || v === null) return '';
  return String(v).trim();
}

function parseIndikator(sheet){
  if(!sheet) return [];
  var rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
  var out = [];
  var codeRe = /^[A-Z]\.\d+$/;
  rows.forEach(function(row){
    var kode = cellText(row[0]);
    if(!codeRe.test(kode)) return;
    var namaFull = cellText(row[1]);
    var nama = namaFull.split('\n')[0];
    var capaian = cellText(row[2]);
    var skor = cellText(row[3]);
    if(!nama) return;
    out.push({ kode:kode, dimensi:kode.charAt(0), nama:nama, capaian:capaian, skor:skor });
  });
  return out;
}

function splitLangkah(text){
  if(!text) return [];
  var parts = text.split(/\n\s*\n/).map(function(p){ return p.trim(); }).filter(Boolean);
  return parts.map(function(p){
    return p.replace(/^\d+\.\s*Inspirasi\s*\d+\s*:\s*/i, '').replace(/^\d+\.\s*/, '').trim();
  });
}

function parseRekomendasi(sheet){
  if(!sheet) return [];
  var rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
  var out = [];
  var headerFound = false;
  for(var i=0;i<rows.length;i++){
    var row = rows[i];
    var a = cellText(row[0]);
    if(!headerFound){
      if(a.toLowerCase() === 'no') headerFound = true;
      continue;
    }
    if(a === '' && cellText(row[1]) === '') continue;
    if(!/^\d+$/.test(a)) continue;
    var indikator = cellText(row[1]);
    var capaian = cellText(row[2]);
    var skor = cellText(row[3]);
    var akarLv1 = cellText(row[4]);
    var akarLv2 = cellText(row[5]);
    var benahi = cellText(row[6]);
    var inspirasi = cellText(row[7]);
    var link = cellText(row[8]);
    var arkas = cellText(row[9]);
    if(!indikator) continue;
    out.push({
      id:uid(), indikator:indikator, capaian:capaian, skor:skor,
      akarMasalah: akarLv2 || akarLv1, benahi:benahi,
      langkah: splitLangkah(inspirasi), link:link, arkas:arkas
    });
  }
  return out;
}

function parseRaporWorkbook(workbook){
  var lapSheet = findSheet(workbook, 'LAPORAN RAPOR');
  var rekomSheet = findSheet(workbook, 'REKOM. PRIORITAS') || findSheet(workbook, 'REKOMENDASI PRIORITAS') || findSheet(workbook, 'REKOM PRIORITAS');
  var indikator = parseIndikator(lapSheet);
  var rekomendasi = parseRekomendasi(rekomSheet);
  var tahun = '';
  if(lapSheet){
    var a1 = cellText(lapSheet['A1'] && lapSheet['A1'].v);
    var m = a1.match(/TAHUN\s+(\d{4})/i);
    if(m) tahun = m[1];
  }
  return { tahun:tahun, indikator:indikator, rekomendasi:rekomendasi, parsedAt:new Date().toISOString() };
}

        langkah:['Kepala satuan pendidikan dan pendidik meningkatkan kompetensi manajemen kelas melalui pelatihan dan refleksi untuk mendukung suasana kondusif yang mengembangkan karakter peserta didik yang bersifat holistik mencakup komponen pengetahuan, afektif, keterampilan, dan perwujudan dalam perilaku. Inspirasi benahi ini mendukung pencapaian standar kompetensi lulusan melalui peningkatan standar PTK dan standar pengelolaan.', 'Kepala satuan pendidikan dan pendidik menyusun dan mengimplementasikan strategi manajemen kelas yang diterapkan melalui intrakurikuler, kokurikuler, dan/atau ekstrakurikuler untuk menciptakan suasana pembelajaran yang kondusif dan mengembangkan karakter peserta didik yang bersifat holistik mencakup komponen pengetahuan, afektif, keterampilan, dan perwujudan dalam perilaku. Inspirasi benahi ini mendukung pencapaian standar kompetensi lulusan melalui peningkatan standar pengelolaan, standar proses dan standar isi', 'Kepala satuan pendidikan mendorong program dan kebijakan manajemen kelas, baik dengan anggaran maupun tanpa anggaran, untuk dapat mengembangkan karakter peserta didik yang bersifat holistik mencakup komponen pengetahuan, afektif, keterampilan, dan perwujudan dalam perilaku. Inspirasi benahi ini mendukung pencapaian standar kompetensi lulusan melalui peningkatan standar pengelolaan dan standar pembiayaan'],

        link:'https://guru.kemendikdasmen.go.id/artikel/128', arkas:'Kegiatan BOS Reguler\n\n- Pengembangan program pencegahan dan penanganan kekerasan dan kekerasan seksual di satuan pendidikan (termasuk program Roots)\n- Penerapan program pencegahan perundungan\n- Peningkatan kompetensi guru untuk memahami tentang perundungan, kekerasan, dan kekerasan seksual' },

function normalizeSchool(s){
  if(!s.rkt) s.rkt = [];
  if(!s.rkjm) s.rkjm = [];
  if(!s.rkas) s.rkas = [];
  if(s.rapor === undefined) s.rapor = null;
  if(!s.kesadaranJawaban) s.kesadaranJawaban = {};
  if(!s.kapasitasJawaban) s.kapasitasJawaban = {};
  if(s.catatan === undefined) s.catatan = '';
  if(!s.kunjungan) s.kunjungan = [];
  if(s.npsn === undefined) s.npsn = '';
  if(s.jenjang === undefined) s.jenjang = '';
  if(s.laporanNomor === undefined) s.laporanNomor = '';
  if(s.laporanTanggal === undefined) s.laporanTanggal = '';
  return s;
}

var TRIWULAN_OPTIONS = [
  { value:'semua', label:'Semua triwulan' },
  { value:'1', label:'Triwulan I (Jan\u2013Mar)' },
  { value:'2', label:'Triwulan II (Apr\u2013Jun)' },

];
function triwulanFilterSelect(currentValue, onSelect){
  var sel = el('select',{class:'year-select'});
  TRIWULAN_OPTIONS.forEach(function(o){
    var opt = el('option',{value:o.value},[o.label]);
    if(String(currentValue) === o.value) opt.setAttribute('selected','selected');
    sel.appendChild(opt);
  });
  sel.addEventListener('change', function(){ onSelect(sel.value); });
  return sel;
}

function kesadaranLevel(s){
  var vals = KESADARAN_Q.map(function(q){ return s.kesadaranJawaban[q.id]; });
  var answered = vals.filter(Boolean);
  if(answered.length < KESADARAN_Q.length) return null;
  return vals.indexOf('berdaya') > -1 ? 'Berdaya' : 'Berkembang';
}
function kapasitasLevel(s){
  var vals = KAPASITAS_Q.map(function(q){ return s.kapasitasJawaban[q.id]; });
  var answered = vals.filter(Boolean);
  if(answered.length < KAPASITAS_Q.length) return null;
  var order = ['rendah','sedang','tinggi'];
  var best = -1;
  vals.forEach(function(v){ var i = order.indexOf(v); if(i>best) best=i; });
  return best>=0 ? (order[best].charAt(0).toUpperCase()+order[best].slice(1)) : null;
}
function strategiFor(s){
  if(s.strategiManual) return s.strategiManual;
  var kes = kesadaranLevel(s), kap = kapasitasLevel(s);
  if(!kes || !kap) return null;
  var m = MATRIX[kes + '|' + kap];
  if(!m) return null;
  return { strategi:m.strategi, metode:m.metode, prioritas:m.prioritas, deskripsi:m.deskripsi, kesadaran:kes, kapasitas:kap };
}

var LOCAL_KEY = STORAGE_KEY;
var hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function');
state.saveWarning = null;

function showSaveWarning(msg){
  state.saveWarning = msg;
  var box = document.getElementById('save-warning-box');
  if(box){ box.textContent = msg; box.style.display = 'block'; }
}
function clearSaveWarning(){
  if(!state.saveWarning) return;
  state.saveWarning = null;
  var box = document.getElementById('save-warning-box');
  if(box) box.style.display = 'none';
}

function localSave(){
  try{
    window.localStorage.setItem(LOCAL_KEY, JSON.stringify(state.data));
    return true;
  }catch(e){ console.error('localStorage save failed', e); return false; }
}
function localLoad(){
  try{
    var raw = window.localStorage.getItem(LOCAL_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ console.error('localStorage load failed', e); return null; }
}

function doSave(){
  if(hasCloudStorage){
    try{
      window.storage.set(STORAGE_KEY, JSON.stringify(state.data), false).then(function(res){
        if(!res){ if(!localSave()) showSaveWarning('Penyimpanan gagal. Segera ekspor data (tombol "Ekspor / Impor JSON") agar tidak kehilangan pekerjaan.'); else clearSaveWarning(); }
        else clearSaveWarning();
      }).catch(function(e){
        console.error('save failed', e);
        if(!localSave()) showSaveWarning('Penyimpanan gagal. Segera ekspor data (tombol "Ekspor / Impor JSON") agar tidak kehilangan pekerjaan.');
        else clearSaveWarning();
      });
    }catch(e){
      console.error('save failed', e);
      if(!localSave()) showSaveWarning('Penyimpanan gagal. Segera ekspor data (tombol "Ekspor / Impor JSON") agar tidak kehilangan pekerjaan.');
      else clearSaveWarning();
    }
  } else {
    if(!localSave()) showSaveWarning('Penyimpanan otomatis tidak tersedia di lingkungan ini. Gunakan tombol "Ekspor / Impor JSON" secara berkala agar pekerjaan tidak hilang.');
    else clearSaveWarning();
  }
}
function save(){
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(doSave, 250);
}
function flushSave(){
  if(state.saveTimer){ clearTimeout(state.saveTimer); state.saveTimer = null; doSave(); }
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') flushSave(); });
window.addEventListener('pagehide', flushSave);
window.addEventListener('beforeunload', flushSave);
function load(){
  if(hasCloudStorage){
    try{
      window.storage.get(STORAGE_KEY, false).then(function(res){
        if(res && res.value){
          applyLoadedData(res.value);
        } else {
          var local = localLoad();
          if(local) applyLoadedObject(local);
        }
        state.loading = false;
        render();
      }).catch(function(){
        var local = localLoad();
        if(local) applyLoadedObject(local);
        state.loading = false;
        render();
      });
    }catch(e){
      var local = localLoad();
      if(local) applyLoadedObject(local);
      state.loading = false;
      render();
    }
  } else {
    var local = localLoad();
    if(local) applyLoadedObject(local);
    state.loading = false;
    render();
  }
}
function applyLoadedData(rawStr){
  try{
    applyLoadedObject(JSON.parse(rawStr));
  }catch(e){ state.data = defaultData(); }
}
function applyLoadedObject(parsed){
  state.data = {
    profile: Object.assign({}, defaultData().profile, (parsed && parsed.profile) || {}),
    schools: (parsed && Array.isArray(parsed.schools)) ? parsed.schools.map(normalizeSchool) : [],
    triwulanMeta: (parsed && parsed.triwulanMeta && typeof parsed.triwulanMeta === 'object') ? parsed.triwulanMeta : {},
    extraYears: (parsed && Array.isArray(parsed.extraYears)) ? parsed.extraYears : []
  };
}

function el(tag, attrs, children){
  var node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if(v === null || v === undefined) return;
    if(k === 'html'){ node.innerHTML = v; }
    else if(k.indexOf('on') === 0){ node.addEventListener(k.slice(2).toLowerCase(), v); }
    else if(k === 'class'){ node.className = v; }
    else { node.setAttribute(k, v); }
  });
  (children||[]).forEach(function(c){ if(c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return node;
}
function text(t){ return document.createTextNode(t); }

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderReflectionBlock(s, kind, title, sub, questions, levels, labels){
  var panel = el('div',{class:'panel'});
  panel.appendChild(el('h2',{},[title + ' \u2014 ' + s.nama]));
  panel.appendChild(el('p',{class:'sub'},[sub]));

  var answers = kind === 'kesadaran' ? s.kesadaranJawaban : s.kapasitasJawaban;

  questions.forEach(function(q, idx){
    var qwrap = el('div',{class:'question'});
    qwrap.appendChild(el('span',{class:'qnum'},['Pertanyaan pemantik '+(idx+1)]));
    qwrap.appendChild(el('p',{class:'qtext'},[q.pemantik]));
    levels.forEach(function(lv){
      var selected = answers[q.id] === lv;
      var opt = el('label',{class:'opt' + (selected?' selected':'')},[
        el('input',{type:'radio', name:kind+'-'+q.id, checked:selected?'checked':null, onchange:function(){
          answers[q.id] = lv; save(); render();
        }}),
        el('div',{},[ el('span',{class:'opt-lvl'},[labels[lv]]), el('span',{class:'opt-text'},[q[lv]]) ])
      ]);
      qwrap.appendChild(opt);
    });
    panel.appendChild(qwrap);
  });

    el('div',{class:'item'},[el('div',{class:'l'},['Hasil']), badgeFor(kind, level)]),
    el('div',{class:'item'},[el('div',{class:'l'},['Status']), text(level ? 'Refleksi lengkap' : 'Jawab semua pertanyaan untuk melihat hasil')])
  ]);
  panel.appendChild(strip);
  return panel;
}

/* ---------- Rapor Pendidikan ---------- */
function capaianClass(cap){
  var c = (cap||'').toLowerCase();
  if(c.indexOf('baik') > -1) return 'baik';
  if(c.indexOf('sedang') > -1 || c.indexOf('cukup') > -1) return 'sedang cap';
  if(c.indexOf('kurang') > -1) return 'kurang';
  return 'muted';
}

function renderRapor(){
  var wrap = el('div',{});
  var picker = el('div',{class:'panel'});
  picker.appendChild(el('h2',{},['Pilih sekolah']));
  picker.appendChild(schoolPicker(function(id){ state.activeSchoolId = id || null; render(); }));
  wrap.appendChild(picker);

  var s = state.data.schools.filter(function(x){ return x.id === state.activeSchoolId; })[0];
  if(!s){
    wrap.appendChild(el('div',{class:'panel'},[el('div',{class:'empty'},[el('p',{},['Pilih sekolah untuk mengunggah dan melihat data Rapor Pendidikan.'])])]));
    return wrap;
  }

  var uploadPanel = el('div',{class:'panel'});
  uploadPanel.appendChild(el('h2',{},['Unggah Rapor Pendidikan \u2014 ' + s.nama]));
  uploadPanel.appendChild(el('p',{class:'sub'},['Unggah file Rapor Pendidikan/PBD (.xlsx) resmi dari platform Rapor Pendidikan. Data indikator dan rekomendasi prioritas akan diambil otomatis untuk mengisi RKT dan RKJM. File diproses langsung di perangkat kamu, tidak diunggah ke server mana pun.']));

  var box = el('div',{class:'upload-box'});
  var msgBox = el('div',{});
  var fname = el('div',{class:'fname'},[ s.rapor ? ('File tersimpan: skor tahun ' + (s.rapor.tahun||'\u2014') + ', ' + s.rapor.indikator.length + ' indikator, ' + s.rapor.rekomendasi.length + ' rekomendasi prioritas.') : 'Belum ada file yang diunggah.' ]);
  var fileInput = el('input',{type:'file', accept:'.xlsx,.xls'});
  fileInput.addEventListener('change', function(){
    var f = fileInput.files[0];
    if(!f) return;
    msgBox.innerHTML = '';
    msgBox.appendChild(el('div',{class:'upload-msg'},['Memproses file\u2026']));
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var workbook = XLSX.read(data, { type:'array' });
        var parsed = parseRaporWorkbook(workbook);
        if(parsed.indikator.length === 0 && parsed.rekomendasi.length === 0){
          msgBox.innerHTML = '';
          msgBox.appendChild(el('div',{class:'upload-msg err'},['File terbaca, tetapi format sheet "2. LAPORAN RAPOR" atau "2.2 REKOM. PRIORITAS" tidak ditemukan. Pastikan ini file Rapor Pendidikan resmi.']));
          return;
        }
        s.rapor = parsed;
        save();
        render();
      }catch(err){
        console.error(err);
        msgBox.innerHTML = '';
        msgBox.appendChild(el('div',{class:'upload-msg err'},['Gagal membaca file. Pastikan formatnya .xlsx dan tidak rusak.']));
      }
    };
    reader.readAsArrayBuffer(f);
  });
  box.appendChild(el('div',{},['Pilih file Rapor Pendidikan (.xlsx)']));
  box.appendChild(fileInput);
  box.appendChild(fname);
  box.appendChild(msgBox);
  uploadPanel.appendChild(box);

  if(s.rapor){
    var row = el('div',{class:'btn-row'});
    row.appendChild(el('button',{class:'btn danger', onclick:function(){
      if(confirm('Hapus data Rapor Pendidikan yang tersimpan untuk sekolah ini?')){
        s.rapor = null; save(); render();
      }
    }},['Hapus data rapor']));
    uploadPanel.appendChild(row);
  }
  wrap.appendChild(uploadPanel);

  if(s.rapor && s.rapor.indikator.length){
    var indPanel = el('div',{class:'panel'});
    indPanel.appendChild(el('h2',{},['Capaian indikator \u2014 tahun ' + (s.rapor.tahun||'\u2014')]));
    indPanel.appendChild(el('p',{class:'sub'},['Diambil dari sheet "2. Laporan Rapor" pada file yang diunggah.']));
    var byDim = {};
    s.rapor.indikator.forEach(function(ind){ (byDim[ind.dimensi]=byDim[ind.dimensi]||[]).push(ind); });
    Object.keys(byDim).sort().forEach(function(d){
      indPanel.appendChild(el('div',{class:'dim-block-title'},[DIM_LABELS[d] || ('Dimensi ' + d)]));
      var table = el('table',{class:'indikator'});
      table.appendChild(el('thead',{},[el('tr',{},[el('th',{},['Kode']), el('th',{},['Indikator']), el('th',{},['Capaian']), el('th',{},['Skor'])])]));
      var tbody = el('tbody',{});
      byDim[d].forEach(function(ind){
        tbody.appendChild(el('tr',{},[
          el('td',{},[ind.kode]), el('td',{},[ind.nama]),
          el('td',{},[el('span',{class:'badge '+capaianClass(ind.capaian)},[ind.capaian||'\u2014'])]),
          el('td',{},[ind.skor||'\u2014'])
        ]));
      });
      table.appendChild(tbody);
      indPanel.appendChild(table);
    });
    wrap.appendChild(indPanel);
  }

  if(s.rapor && s.rapor.rekomendasi.length){
    var rekomPanel = el('div',{class:'panel'});
    rekomPanel.appendChild(el('h2',{},['Rekomendasi prioritas dari Rapor Pendidikan']));
    rekomPanel.appendChild(el('p',{class:'sub'},['Diambil dari sheet "2.2 Rekom. Prioritas". Rekomendasi ini otomatis tersedia untuk dipilih pada tahap RKT dan RKJM.']));
    s.rapor.rekomendasi.forEach(function(r, i){
      var item = el('div',{class:'rekom-item'});
      item.appendChild(el('div',{class:'rekom-head'},[
        el('div',{},[
          el('div',{class:'rekom-title'},[(i+1)+'. '+r.indikator]),
          el('div',{class:'rekom-akar'},['Akar masalah: '+r.akarMasalah])
        ]),
        el('span',{class:'badge '+capaianClass(r.capaian)},[r.capaian||'\u2014'])
      ]));
      rekomPanel.appendChild(item);
    });
    wrap.appendChild(rekomPanel);
  }

  return wrap;
}

/* ---------- RKT ---------- */
function rekomToLib(r){
  return { dimensi:r.indikator, judul:r.akarMasalah || r.indikator,
    langkah: r.langkah.length ? r.langkah : (r.benahi ? [r.benahi] : []) };
}

function addProgramToList(s, listKey, item, sourceKey, withYear){
  var entry = { id:uid(), dimensi:item.dimensi, judul:item.judul, langkah:item.langkah.slice(), custom:false, sourceKey:sourceKey };
  if(withYear) entry.tahun = 1;
  if(listKey === 'rkt') entry.triwulan = null;
  s[listKey].push(entry);
}

function renderRaporRekomPicker(s, listKey){
  if(!s.rapor || !s.rapor.rekomendasi.length) return null;
  var panel = el('div',{class:'panel'});
  panel.appendChild(el('h2',{},['Rekomendasi dari Rapor Pendidikan']));
  panel.appendChild(el('p',{class:'sub'},['Diambil dari hasil analisis Rapor Pendidikan sekolah ini (tahun '+(s.rapor.tahun||'\u2014')+'). Centang untuk menambahkan ke daftar program.']));
  s.rapor.rekomendasi.forEach(function(r, i){
    var sourceKey = 'rapor:'+r.id;
    var libItem = rekomToLib(r);
    var already = s[listKey].some(function(x){ return x.sourceKey === sourceKey; });
    var box = el('div',{class:'prog-item'});
    var chk = el('input',{class:'chk', type:'checkbox', checked: already?'checked':null, onchange:function(){
      if(chk.checked){ addProgramToList(s, listKey, libItem, sourceKey, listKey==='rkjm'); }
      else { s[listKey] = s[listKey].filter(function(x){ return x.sourceKey !== sourceKey; }); }
      save(); render();
    }});
    var headRow = el('div',{class:'prog-head'},[
      chk,
      el('div',{style:'flex:1'},[
        el('div',{class:'prog-title'},[(i+1)+'. '+r.indikator+' \u2014 '+r.akarMasalah]),
      ])
    ]);
    box.appendChild(headRow);
    if(libItem.langkah.length){
      var ol = el('ol',{class:'steps'});
      libItem.langkah.forEach(function(st){ ol.appendChild(el('li',{},[st])); });
      box.appendChild(ol);
    }
    if(r.arkas){
      box.appendChild(el('div',{style:'font-size:12px;color:var(--ink-soft);margin-top:8px'},[el('strong',{},['Kegiatan ARKAS terkait: ']), text(r.arkas.split('\n')[0])]));
    }
    panel.appendChild(box);
  });
  return panel;
}

function renderCustomProgramPanel(s, listKey, targetLabel){

function renderSelectedPanel(s, listKey, withYear, withTriwulan, filterQ){
  var panel = el('div',{class:'panel'});
  var headRow = el('div',{style:'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px'},[
    el('h2',{style:'margin:0'},['Program terpilih ('+s[listKey].length+')'])
  ]);
  panel.appendChild(headRow);
  if(s[listKey].length === 0){
    panel.appendChild(el('div',{class:'empty'},[el('p',{},['Belum ada program yang dipilih.'])]));
    return panel;
  }
  if(withTriwulan){
    var filterRow = el('div',{class:'btn-row no-print', style:'margin-bottom:10px'});
    filterRow.appendChild(triwulanFilterSelect(filterQ, function(v){ state.rktFilterQ = v; render(); }));
    panel.appendChild(filterRow);
  }
  var items = s[listKey];
  if(withTriwulan && filterQ && filterQ !== 'semua'){
    items = items.filter(function(r){ return String(r.triwulan||'') === String(filterQ); });
  }
  if(withTriwulan) headRow.appendChild(el('span',{style:'font-size:12.5px;color:var(--ink-soft)'},[items.length+' dari '+s[listKey].length+' program ditampilkan']));
  if(items.length === 0){
    panel.appendChild(el('div',{class:'empty'},[el('p',{},['Tidak ada program pada triwulan yang dipilih.'])]));
    return panel;
  }
  var list = el('div',{class:'selected-list'});
  items.forEach(function(r){
    var row = el('div',{class:'row'});
    row.appendChild(el('div',{class:'t'},[ el('strong',{},[r.dimensi+' \u2014 ']), text(r.judul) ]));
    if(withYear){
      var sel = el('select',{class:'year-select'});
      [1,2,3,4].forEach(function(y){
        var o = el('option',{value:String(y)},['Tahun '+y]);
        if(r.tahun === y) o.setAttribute('selected','selected');
        sel.appendChild(o);
      });
      sel.addEventListener('change', function(){ r.tahun = parseInt(sel.value,10); save(); render(); });
      row.appendChild(sel);
    }
    if(withTriwulan){
      var twSel = el('select',{class:'year-select'});
      [['','Triwulan \u2014'],['1','Triwulan I'],['2','Triwulan II'],['3','Triwulan III'],['4','Triwulan IV']].forEach(function(pair){
        var o = el('option',{value:pair[0]},[pair[1]]);
        if(String(r.triwulan||'') === pair[0]) o.setAttribute('selected','selected');
        twSel.appendChild(o);
      });
      twSel.addEventListener('change', function(){ r.triwulan = twSel.value || null; save(); render(); });
      row.appendChild(twSel);
    }
    row.appendChild(el('button',{class:'remove-x', 'aria-label':'Hapus', onclick:function(){
      s[listKey] = s[listKey].filter(function(x){ return x.id !== r.id; });
      save(); render();
    }},['\u00D7']));
    list.appendChild(row);
  });
  panel.appendChild(list);
  return panel;
}

function renderRkt(){
  var wrap = el('div',{});
  var picker = el('div',{class:'panel'});
  picker.appendChild(el('h2',{},['Pilih sekolah']));
  picker.appendChild(schoolPicker(function(id){ state.activeSchoolId = id || null; render(); }));
  wrap.appendChild(picker);

  var s = state.data.schools.filter(function(x){ return x.id === state.activeSchoolId; })[0];
  if(!s){
    wrap.appendChild(el('div',{class:'panel'},[el('div',{class:'empty'},[el('p',{},['Pilih sekolah untuk menyusun Rencana Kerja Tahunan (RKT).'])])]));
    return wrap;
  }
  var strat = strategiFor(s);

  var raporPanel = renderRaporRekomPicker(s, 'rkt');
  if(raporPanel) wrap.appendChild(raporPanel);
  wrap.appendChild(renderLibraryPicker(s, 'rkt'));
  wrap.appendChild(renderCustomProgramPanel(s, 'rkt', 'RKT'));
  wrap.appendChild(renderSelectedPanel(s, 'rkt', false, true, state.rktFilterQ));
  wrap.appendChild(renderReportPanel(s, strat));
  return wrap;
}

function renderReportPanel(s, strat){
  var panel = el('div',{class:'panel'});
  var barRow = el('div',{style:'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px'},[
    el('h2',{style:'margin:0'},['Ringkasan pendampingan']),
  ]);
  panel.appendChild(barRow);
  panel.appendChild(el('p',{class:'sub'},['Rangkuman siap cetak untuk didokumentasikan sebagai hasil pendampingan sekolah binaan.']));

  var report = el('div',{class:'report', id:'report-'+s.id});
  var prof = state.data.profile;
  report.appendChild(el('div',{class:'rpt-title'},['Ringkasan Pendampingan \u2014 ' + (s.nama||'(tanpa nama)')]));
  report.appendChild(el('div',{class:'rpt-sub'},[
    (prof.nama||'\u2014') + ', ' + (prof.jabatan||'Pengawas Sekolah') + (prof.wilayah ? ', '+prof.wilayah : '')
  ]));

  report.appendChild(el('h3',{},['Identitas sekolah']));
  report.appendChild(el('p',{},['Sekolah: ' + (s.nama||'\u2014') + '. Kepala sekolah: ' + (s.kepsek||'\u2014') + (s.nip? ' (NIP '+s.nip+')':'') + '. Kecamatan: ' + (s.kecamatan||'\u2014') + '.']));

  report.appendChild(el('h3',{},['Hasil refleksi komitmen perubahan']));
  var kes = kesadaranLevel(s), kap = kapasitasLevel(s);
  report.appendChild(el('p',{},['Tingkat kesadaran kepala sekolah dalam melakukan refleksi: ' + (kes||'belum lengkap') + '. Tingkat kapasitas kepala sekolah dalam memimpin perubahan: ' + (kap||'belum lengkap') + '.']));

  report.appendChild(el('h3',{},['Strategi dan metode pendampingan']));
  if(strat){
    report.appendChild(el('p',{},['Strategi pendampingan yang digunakan adalah ' + strat.strategi + ', dengan metode ' + strat.metode + ', pada ' + strat.prioritas.toLowerCase() + '. ' + strat.deskripsi]));
  } else {
    report.appendChild(el('p',{},['Strategi pendampingan belum dapat ditentukan karena refleksi belum lengkap.']));
  }

  report.appendChild(el('h3',{},['Rekomendasi program Rencana Kerja Tahunan (RKT)']));
  if(s.rkt.length === 0){
    report.appendChild(el('p',{},['Belum ada program RKT yang dipilih untuk sekolah ini.']));
  } else {
    s.rkt.forEach(function(r, i){
      report.appendChild(el('p',{style:'margin-bottom:2px'},[ el('strong',{},[(i+1)+'. ['+r.dimensi+'] '+r.judul]) ]));
      var ol = el('ol',{});
      r.langkah.forEach(function(st){ ol.appendChild(el('li',{},[st])); });
      report.appendChild(ol);
    });
  }

  if(s.catatan){
    report.appendChild(el('h3',{},['Catatan tambahan']));
    report.appendChild(el('p',{},[s.catatan]));
  }

  panel.appendChild(report);

  panel.appendChild(el('label',{class:'field', style:'margin-top:18px'},[el('span',{},['Catatan tambahan (opsional)']),
    el('textarea',{oninput:function(e){ s.catatan = e.target.value; save(); }},[])
  ]));
  var noteArea = panel.querySelector('textarea');
  noteArea.value = s.catatan || '';

  var actions = el('div',{class:'btn-row no-print'});
  actions.appendChild(el('button',{class:'btn secondary', onclick:function(){ window.print(); }},['Cetak / simpan sebagai PDF']));
  actions.appendChild(el('button',{class:'btn ghost', onclick:function(){
    var el2 = document.getElementById('report-'+s.id);
    var txt = el2.innerText;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ alert('Ringkasan disalin ke clipboard.'); });
    }
  }},['Salin teks']));
  panel.appendChild(actions);

  return panel;
}

  panel.appendChild(el('p',{class:'sub'},['Ringkasan status pendampingan seluruh sekolah, untuk dilampirkan pada laporan akhir.']));

    return panel;
  }
  var table = el('table',{class:'roster'});
  table.appendChild(el('thead',{},[el('tr',{},[
    el('th',{},['Sekolah']), el('th',{},['Kesadaran']), el('th',{},['Kapasitas']),
    el('th',{},['Strategi']), el('th',{},['Prioritas']), el('th',{},['Program RKT']), el('th',{},['Program RKJM']), el('th',{},['Total RKAS'])
  ])]));
  var tbody = el('tbody',{});
  state.data.schools.forEach(function(s){
    var strat = strategiFor(s);
    var totalRkas = s.rkas.reduce(function(acc,r){ return acc + rkasTotal(r); }, 0);
    tbody.appendChild(el('tr',{},[
      el('td',{},[s.nama||'(tanpa nama)']),
      el('td',{},[badgeFor('kes', kesadaranLevel(s))]),
      el('td',{},[badgeFor('kap', kapasitasLevel(s))]),
      el('td',{},[strat ? strat.strategi : el('span',{class:'badge muted'},['\u2014'])]),
      el('td',{},[strat ? badgeFor('pri', strat.prioritas) : el('span',{class:'badge muted'},['\u2014'])]),
      el('td',{},[String(s.rkt.length)]),
      el('td',{},[String(s.rkjm.length)]),
      el('td',{},[rupiah(totalRkas)])
    ]));
  });
  table.appendChild(tbody);
  panel.appendChild(table);

  var actions = el('div',{class:'btn-row no-print'});
  actions.appendChild(el('button',{class:'btn ghost', onclick:function(){ window.print(); }},['Cetak rekapitulasi']));
  panel.appendChild(actions);
  return panel;
}

/* ---------- RKA / RKAS ---------- */
var SUMBER_DANA = ['BOS Reguler', 'BOP Kinerja', 'BOSDA', 'Komite Sekolah', 'APBD', 'Lainnya'];

function rupiah(n){
  n = Number(n)||0;
  return 'Rp' + n.toLocaleString('id-ID');
}

function rkasTotal(row){ return (Number(row.volume)||0) * (Number(row.hargaSatuan)||0); }

function addRkasRow(s, data){
  s.rkas.push(Object.assign({ id:uid(), kegiatan:'', komponen:'', sumberDana:'BOS Reguler', volume:1, satuan:'paket', hargaSatuan:0, sourceKey:null, triwulan:null }, data));
}

function renderRkas(){
  var wrap = el('div',{});
  var picker = el('div',{class:'panel'});
  picker.appendChild(el('h2',{},['Pilih sekolah']));
  picker.appendChild(el('p',{class:'sub'},['Susun Rencana Kegiatan dan Anggaran Sekolah (RKA/RKAS) berdasarkan hasil analisis Rapor Pendidikan dan program RKT yang sudah dipilih. Semua nilai dapat diedit langsung pada tabel.']));
  picker.appendChild(schoolPicker(function(id){ state.activeSchoolId = id || null; render(); }));
  wrap.appendChild(picker);

  var s = state.data.schools.filter(function(x){ return x.id === state.activeSchoolId; })[0];
  if(!s){
    wrap.appendChild(el('div',{class:'panel'},[el('div',{class:'empty'},[el('p',{},['Pilih sekolah untuk menyusun RKA/RKAS.'])])]));
    return wrap;
  }

  /* --- Sumber: rekomendasi rapor pendidikan (kolom ARKAS) --- */
  if(s.rapor && s.rapor.rekomendasi.length){
    var rekomPanel = el('div',{class:'panel'});
    rekomPanel.appendChild(el('h2',{},['Tambah dari rekomendasi Rapor Pendidikan']));
    rekomPanel.appendChild(el('p',{class:'sub'},['Diambil dari kolom kegiatan ARKAS pada hasil analisis Rapor Pendidikan. Centang untuk menambahkan sebagai baris RKAS (nilai volume dan harga satuan diisi 0, silakan sesuaikan).']));
    s.rapor.rekomendasi.forEach(function(r, i){
      var sourceKey = 'rapor:'+r.id;
      var already = s.rkas.some(function(x){ return x.sourceKey === sourceKey; });
      var box = el('div',{class:'prog-item'});
      var chk = el('input',{class:'chk', type:'checkbox', checked: already?'checked':null, onchange:function(){
        if(chk.checked){
          var keg = r.arkas ? r.arkas.split('\n')[0] : (r.benahi || r.indikator);
          addRkasRow(s, { kegiatan:keg, komponen:r.indikator, sourceKey:sourceKey });
        } else {
          s.rkas = s.rkas.filter(function(x){ return x.sourceKey !== sourceKey; });
        }
        save(); render();
      }});
      box.appendChild(el('div',{class:'prog-head'},[
        chk,
        el('div',{style:'flex:1'},[el('div',{class:'prog-title'},[(i+1)+'. '+r.indikator+' \u2014 '+(r.akarMasalah||'')])])
      ]));
      if(r.arkas) box.appendChild(el('div',{style:'font-size:12px;color:var(--ink-soft);margin-top:6px'},[text(r.arkas.split('\n')[0])]));
      rekomPanel.appendChild(box);
    });
    wrap.appendChild(rekomPanel);
  }

  /* --- Sumber: program RKT terpilih --- */
  if(s.rkt.length){
    var rktPanel = el('div',{class:'panel'});
    rktPanel.appendChild(el('h2',{},['Tambah dari program RKT terpilih']));
    rktPanel.appendChild(el('p',{class:'sub'},['Ubah program Rencana Kerja Tahunan yang sudah dipilih menjadi baris anggaran.']));
    s.rkt.forEach(function(r){
      var sourceKey = 'rkt:'+r.id;
      var already = s.rkas.some(function(x){ return x.sourceKey === sourceKey; });
      var box = el('div',{class:'prog-item'});
      var chk = el('input',{class:'chk', type:'checkbox', checked: already?'checked':null, onchange:function(){
        if(chk.checked){ addRkasRow(s, { kegiatan:r.judul, komponen:r.dimensi, sourceKey:sourceKey }); }
        else { s.rkas = s.rkas.filter(function(x){ return x.sourceKey !== sourceKey; }); }
        save(); render();
      }});
      box.appendChild(el('div',{class:'prog-head'},[
        chk, el('div',{style:'flex:1'},[el('div',{class:'prog-title'},['['+r.dimensi+'] '+r.judul])])
      ]));
      rktPanel.appendChild(box);
    });
    wrap.appendChild(rktPanel);
  }

  /* --- Tambah baris manual --- */
  var manPanel = el('div',{class:'panel'});
  manPanel.appendChild(el('h2',{},['Tambah baris manual']));
  manPanel.appendChild(el('button',{class:'btn secondary', onclick:function(){
    addRkasRow(s, {});
    save(); render();
  }},['+ Tambah baris kosong']));
  wrap.appendChild(manPanel);

  /* --- Tabel RKAS --- */
  var tablePanel = el('div',{class:'panel'});
  var headRow = el('div',{style:'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px'},[
    el('h2',{style:'margin:0'},['Tabel RKA/RKAS \u2014 ' + s.nama])
  ]);
  tablePanel.appendChild(headRow);
  tablePanel.appendChild(el('p',{class:'sub'},['Klik pada sel untuk mengedit langsung. Kolom "Jumlah" dihitung otomatis dari volume \u00D7 harga satuan. Isi kolom "Triwulan" untuk menandai rencana pelaksanaan tiap kegiatan.']));

  var rkasFilterRow = el('div',{class:'btn-row no-print', style:'margin-bottom:10px'});
  rkasFilterRow.appendChild(triwulanFilterSelect(state.rkasFilterQ, function(v){ state.rkasFilterQ = v; render(); }));
  tablePanel.appendChild(rkasFilterRow);

  var visibleRkas = s.rkas.filter(function(r){
    if(state.rkasFilterQ === 'semua') return true;
    return String(r.triwulan||'') === String(state.rkasFilterQ);
  });

  if(s.rkas.length === 0){
    tablePanel.appendChild(el('div',{class:'empty'},[el('p',{},['Belum ada baris RKA/RKAS. Tambahkan dari rekomendasi di atas, atau tambah baris manual.'])]));
  } else if(visibleRkas.length === 0){
    tablePanel.appendChild(el('div',{class:'empty'},[el('p',{},['Belum ada baris RKA/RKAS untuk triwulan yang dipilih.'])]));
  } else {
    var table = el('table',{class:'rkas'});
    table.appendChild(el('thead',{},[el('tr',{},[
      el('th',{},['Kegiatan']), el('th',{},['Komponen/Dimensi']), el('th',{},['Sumber Dana']),
      el('th',{},['Triwulan']),
      el('th',{},['Volume']), el('th',{},['Satuan']), el('th',{},['Harga Satuan (Rp)']),
      el('th',{},['Jumlah (Rp)']), el('th',{},[''])
    ])]));
    var tbody = el('tbody',{});
    visibleRkas.forEach(function(r){
      var kegIn = el('input',{class:'rkas-cell-input', type:'text', value:r.kegiatan, placeholder:'Nama kegiatan', oninput:function(e){ r.kegiatan=e.target.value; save(); }});
      var komIn = el('input',{class:'rkas-cell-input', type:'text', value:r.komponen, placeholder:'Komponen', oninput:function(e){ r.komponen=e.target.value; save(); }});
      var sumSel = el('select',{class:'rkas-cell-input', onchange:function(){ r.sumberDana=sumSel.value; save(); render(); }});
      SUMBER_DANA.forEach(function(sd){
        var o = el('option',{value:sd},[sd]);
        if(sd === r.sumberDana) o.setAttribute('selected','selected');
        sumSel.appendChild(o);
      });
      var volIn = el('input',{class:'rkas-cell-input', type:'number', min:'0', value:String(r.volume), oninput:function(e){ r.volume=e.target.value; save(); render(); }});
      var satIn = el('input',{class:'rkas-cell-input', type:'text', value:r.satuan, placeholder:'paket/kali/org', oninput:function(e){ r.satuan=e.target.value; save(); }});
      var hargaIn = el('input',{class:'rkas-cell-input', type:'number', min:'0', step:'1000', value:String(r.hargaSatuan), oninput:function(e){ r.hargaSatuan=e.target.value; save(); render(); }});
      var twSel = el('select',{class:'rkas-cell-input', onchange:function(){ r.triwulan = twSel.value || null; save(); render(); }});
      [['','\u2014'],['1','I'],['2','II'],['3','III'],['4','IV']].forEach(function(pair){
        var o = el('option',{value:pair[0]},[pair[1]]);
        if(String(r.triwulan||'') === pair[0]) o.setAttribute('selected','selected');
        twSel.appendChild(o);
      });
      var tds = [

/* ---------- Laporan Triwulanan ---------- */
var BULAN_ID = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
var TRIWULAN_LABEL = {
  1: { roman:'I', rentang:'Januari \u2013 Maret' },
  2: { roman:'II', rentang:'April \u2013 Juni' },
  3: { roman:'III', rentang:'Juli \u2013 September' },
  4: { roman:'IV', rentang:'Oktober \u2013 Desember' }
};

function parseTanggalIndo(str){
  if(!str) return null;
  var low = String(str).toLowerCase();
  var yearMatch = low.match(/\b(19|20)\d{2}\b/);
  if(!yearMatch) return null;
  var year = parseInt(yearMatch[0], 10);
  var monthIdx = -1;
  for(var i=0;i<BULAN_ID.length;i++){
    if(low.indexOf(BULAN_ID[i]) > -1){ monthIdx = i; break; }
  }
  if(monthIdx === -1){
    var m = low.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
    if(m){
      var mm = parseInt(m[2],10);
      if(mm>=1 && mm<=12){ monthIdx = mm-1; }
    } else {
      var m2 = low.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);
      if(m2){ var mm2 = parseInt(m2[2],10); if(mm2>=1 && mm2<=12) monthIdx = mm2-1; }
    }
  }
  if(monthIdx === -1) return null;
  var dayMatch = low.match(/\b(\d{1,2})\b/);
  var day = dayMatch ? parseInt(dayMatch[0],10) : 1;
  return { day:day, month:monthIdx, year:year };
}
function triwulanOfMonth(month){ return Math.floor(month/3) + 1; }

function collectTriwulanYears(){
  var years = {};
  state.data.schools.forEach(function(s){
    s.kunjungan.forEach(function(v){
      var d = parseTanggalIndo(v.tanggal);
      if(d) years[d.year] = true;
    });
  });
  var arr = Object.keys(years).map(Number).sort(function(a,b){ return b-a; });
  if(arr.length === 0) arr.push(new Date().getFullYear());
  return arr;
}

function selectableYears(){
  var years = {};
  collectTriwulanYears().forEach(function(y){ years[y] = true; });
  var now = new Date().getFullYear();
  for(var y = now-2; y <= now+3; y++){ years[y] = true; }
  (state.data.extraYears||[]).forEach(function(y){ years[Number(y)] = true; });
  return Object.keys(years).map(Number).sort(function(a,b){ return b-a; });
}

function addYearControl(onAdded){
  var wrap = el('span',{style:'display:inline-flex;gap:4px;align-items:center'});
  var input = el('input',{type:'number', placeholder:'Tahun lain', style:'width:100px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:3px;font-family:\'Public Sans\',sans-serif;font-size:13px'});
  var btn = el('button',{class:'btn ghost', type:'button', style:'padding:6px 10px', onclick:function(){
    var y = parseInt(input.value,10);
    if(!y || y < 1900 || y > 3000) return;
    if(!state.data.extraYears) state.data.extraYears = [];
    if(state.data.extraYears.indexOf(y) === -1) state.data.extraYears.push(y);
    input.value = '';
    save();

  wrap.appendChild(input);
  wrap.appendChild(btn);
  return wrap;

      ]));
    }

    report.appendChild(el('h3',{},['2. Rincian kegiatan pendampingan']));
    if(items.length === 0){
      report.appendChild(el('p',{},['Tidak ada data untuk ditampilkan.']));
    } else {
      var ol = el('ol',{});
      items.forEach(function(it){
        var li = el('li',{style:'margin-bottom:8px'});
        li.appendChild(el('div',{},[el('strong',{},[it.v.tanggal + ' \u2014 ' + it.school.nama + ' \u2014 ' + it.v.jenis])]));
        if(it.v.hasil) li.appendChild(el('div',{},[it.v.hasil]));
        if(it.v.tindaklanjut) li.appendChild(el('div',{style:'color:var(--ink-soft);font-size:13px'},['Tindak lanjut: '+it.v.tindaklanjut]));
        ol.appendChild(li);
      });
      report.appendChild(ol);
    }

    report.appendChild(el('h3',{},['3. Rekap per sekolah binaan']));
    if(items.length === 0){
      report.appendChild(el('p',{},['\u2014']));
    } else {
      var perSchool = {};
      items.forEach(function(it){
        if(!perSchool[it.school.id]) perSchool[it.school.id] = { nama: it.school.nama, count:0 };
        perSchool[it.school.id].count++;
      });
      var tbl2 = el('table',{class:'rkas'});
      tbl2.appendChild(el('thead',{},[el('tr',{},[el('th',{},['Sekolah']), el('th',{},['Jumlah kunjungan'])])]));
      var tb2 = el('tbody',{});
      Object.keys(perSchool).map(function(k){ return perSchool[k]; }).sort(function(a,b){ return (a.nama||'').localeCompare(b.nama||''); }).forEach(function(row){
        tb2.appendChild(el('tr',{},[el('td',{},[row.nama||'\u2014']), el('td',{class:'num'},[String(row.count)])]));
      });
      tbl2.appendChild(tb2);
      report.appendChild(tbl2);
    }

    var sigWrap = el('div',{style:'display:flex;justify-content:space-between;gap:24px;margin-top:50px;font-family:\'Public Sans\',sans-serif;font-size:13.5px'});
    sigWrap.appendChild(el('div',{style:'text-align:center;width:220px'},[
      el('div',{},['Mengetahui,']),
      el('div',{},['Koordinator Pengawas Sekolah']),
      el('div',{style:'height:70px'},[]),
      el('div',{style:'font-weight:600;border-top:1px solid var(--ink);padding-top:4px'},['(\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026)']),
      el('div',{style:'font-size:12px;color:var(--ink-soft)'},['\u00A0'])
    ]));
    sigWrap.appendChild(el('div',{style:'text-align:center;width:220px'},[
      el('div',{},[(meta.tanggal||'\u2026\u2026\u2026\u2026\u2026, \u2026\u2026\u2026')]),
      el('div',{},['Pengawas Sekolah']),
      el('div',{style:'height:70px'},[]),
      el('div',{style:'font-weight:600;border-top:1px solid var(--ink);padding-top:4px'},[prof.nama || '(\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026)']),
      el('div',{style:'font-size:12px;color:var(--ink-soft)'},[prof.nip ? 'NIP '+prof.nip : '\u00A0'])
    ]));
    report.appendChild(sigWrap);

    panel.appendChild(report);

    var actions = el('div',{class:'btn-row no-print'});
    actions.appendChild(el('button',{class:'btn secondary', onclick:function(){ window.print(); }},['Cetak semua triwulan / simpan sebagai PDF']));
    actions.appendChild(el('button',{class:'btn ghost', onclick:function(){
      var elx = document.getElementById(reportId);
      var txt = elx.innerText;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ alert('Laporan Triwulan '+TRIWULAN_LABEL[q].roman+' disalin ke clipboard.'); });
      }
    }},['Salin teks triwulan '+TRIWULAN_LABEL[q].roman]));
    panel.appendChild(actions);

    wrap.appendChild(panel);
  });

  return wrap;
}

load();
})();
</script>
</body>
</html>
